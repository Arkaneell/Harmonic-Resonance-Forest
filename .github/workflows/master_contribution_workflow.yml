name: Master Contribution Workflow

on:
  workflow_dispatch:
    inputs:
      target_type:
        description: Target to process manually
        required: false
        default: issue
        type: choice
        options:
          - issue
          - pull_request
      target_number:
        description: Issue or pull request number
        required: false
        type: string
      action_mode:
        description: Manual action to simulate
        required: false
        default: opened
        type: choice
        options:
          - opened
          - reopened
          - closed
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review, closed]

permissions:
  issues: write
  pull-requests: write
  contents: read

concurrency:
  group: master-contribution-workflow-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}-${{ github.event.action || github.run_number }}
  cancel-in-progress: false

jobs:
  guide_and_enforce:
    runs-on: ubuntu-latest

    steps:
      - name: Enforce contribution workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventName = context.eventName;
            const action = context.payload.action || core.getInput('action_mode') || 'opened';
            const manualTargetType = (core.getInput('target_type') || 'issue').trim();
            const manualTargetNumberRaw = (core.getInput('target_number') || '').trim();
            const manualTargetNumber = manualTargetNumberRaw ? Number(manualTargetNumberRaw) : NaN;

            const GUIDE_MARKER = '<!-- master-contribution-workflow:issue-guide -->';
            const LINK_MARKER_PREFIX = '<!-- master-contribution-workflow:linked-pr:';
            const MERGED_MARKER_PREFIX = '<!-- master-contribution-workflow:merged-pr:';

            const contributorGuide = `
            ${GUIDE_MARKER}

            Hi @{{USER}} 👋

            Thanks for contributing.

            To keep the project fair, clear, and easy to review, please follow this flow:

            1. Open one focused issue.
               - Keep the issue specific and well described.
               - Avoid mixing multiple unrelated tasks in one issue.

            2. Wait for maintainer review before starting work.
               - Please do not begin implementation until the issue is acknowledged or assigned.
               - This helps avoid duplicated work.

            3. Work on one active issue at a time, especially as a new contributor.
               - Finish the current issue first.
               - After your PR is merged, you may pick up the next issue.

            4. Open a pull request linked to the issue.
               - Use clear wording in the PR body.
               - Prefer "Fixes #<issue>" or "Closes #<issue>" when applicable.

            5. Close the issue politely once the PR is merged.
               - If your PR resolves the issue, the issue should be closed through the PR or by the maintainers.
               - Please keep the issue thread respectful and concise.

            Additional rules:
            - Do not claim multiple issues at once without permission.
            - Keep pull requests small and relevant.
            - Do not open duplicate issues or duplicate PRs.
            - If the implementation changes direction, update the issue thread early.
            - If you are blocked, comment so the issue can be released for someone else.

            We appreciate careful, high-quality work. Small, focused contributions are easier to review and much easier to merge.
            `;

            const prNeedsLinkTemplate = `
            Hi @{{USER}} 👋

            Thanks for the pull request.

            Please link this PR to a relevant issue before review. A good PR should be:
            - tied to one approved issue
            - focused on a single task
            - easy to review
            - free of unrelated changes

            Recommended format:
            - \`Fixes #123\`
            - \`Closes #123\`
            - \`Resolves #123\`

            Once the PR is accepted and merged, the issue should be closed politely and the next issue can be picked up.

            ${GUIDE_MARKER}
            `;

            const prLinkedTemplate = (prNumber) => `
            ${LINK_MARKER_PREFIX}${prNumber} -->

            Hi @{{USER}} 👋

            This issue has been linked to a pull request. Thank you for working on it carefully.

            Please keep the PR focused, and once the PR is merged, this issue will be closed politely through the normal review flow.
            `;

            const prMergedTemplate = (prNumber) => `
            ${MERGED_MARKER_PREFIX}${prNumber} -->

            Hi @{{USER}} 👋

            This issue has been resolved by a merged pull request. Thank you for the disciplined contribution.

            Closing this issue now to keep the workflow clean and up to date.
            `;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({ owner, repo, name, color, description });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                }
              }
            }

            async function addLabels(number, labels) {
              if (!labels?.length) return;
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels });
              } catch (error) {
                if (error.status === 404 || error.status === 422) return;
                throw error;
              }
            }

            async function createCommentOnce(number, body, marker) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: number,
                per_page: 100,
              });

              if (comments.some(comment => typeof comment.body === 'string' && comment.body.includes(marker))) {
                return false;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body,
              });
              return true;
            }

            function withUser(body, login) {
              return body.replaceAll('{{USER}}', login || 'contributor');
            }

            function extractLinkedIssueNumbers(body) {
              if (!body) return [];
              const numbers = new Set();
              const regex = /\b(?:fix(?:es|ed)?|close(?:s|d)?|resolve(?:s|d)?)\s+(?:[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+#|#)(\d+)\b/gi;
              let match;
              while ((match = regex.exec(body)) !== null) {
                const n = Number(match[1]);
                if (Number.isInteger(n) && n > 0) numbers.add(n);
              }
              return [...numbers];
            }

            async function getManualTarget() {
              if (!Number.isInteger(manualTargetNumber) || manualTargetNumber <= 0) return null;

              if (manualTargetType === 'pull_request') {
                const { data: pull } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: manualTargetNumber,
                });
                return { kind: 'pull_request', data: pull };
              }

              const { data: issue } = await github.rest.issues.get({
                owner,
                repo,
                issue_number: manualTargetNumber,
              });
              if (issue.pull_request) {
                const { data: pull } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: manualTargetNumber,
                });
                return { kind: 'pull_request', data: pull };
              }
              return { kind: 'issue', data: issue };
            }

            await ensureLabel('status:needs-review', 'd4c5f9', 'Waiting for maintainer review');
            await ensureLabel('status:in-progress', 'b6e3ff', 'Work is currently in progress');
            await ensureLabel('status:needs-info', 'ffd6a5', 'Needs clarification or more details');
            await ensureLabel('status:blocked', 'ffb3c7', 'Blocked pending response');
            await ensureLabel('status:duplicate', 'ffadad', 'Duplicate issue or PR');
            await ensureLabel('status:ready-to-close', 'b7eb8f', 'Ready to be closed after merge');

            let targetKind = null;
            let target = null;

            if (eventName === 'issues' && context.payload.issue) {
              targetKind = 'issue';
              target = context.payload.issue;
            } else if (eventName === 'pull_request_target' && context.payload.pull_request) {
              targetKind = 'pull_request';
              target = context.payload.pull_request;
            } else if (eventName === 'workflow_dispatch') {
              const manual = await getManualTarget().catch(error => {
                core.setFailed(`Manual target lookup failed: ${error.message}`);
                return null;
              });
              if (!manual) return;
              targetKind = manual.kind;
              target = manual.data;
            } else {
              core.info('No actionable issue or pull request context found. Skipping.');
              return;
            }

            const login = target.user?.login || context.actor || 'contributor';

            if (targetKind === 'issue') {
              const guideBody = withUser(contributorGuide, login);
              await createCommentOnce(target.number, guideBody, GUIDE_MARKER);
              await addLabels(target.number, ['status:needs-review']);
              return;
            }

            const prBody = target.body || '';
            const linkedIssues = extractLinkedIssueNumbers(prBody);

            if (action !== 'closed') {
              if (!linkedIssues.length) {
                const body = withUser(prNeedsLinkTemplate, login);
                await createCommentOnce(target.number, body, GUIDE_MARKER);
              } else {
                for (const issueNumber of linkedIssues) {
                  const issueBody = withUser(prLinkedTemplate(target.number), login);
                  await createCommentOnce(issueNumber, issueBody, `${LINK_MARKER_PREFIX}${target.number} -->`);
                  await addLabels(issueNumber, ['status:in-progress']);
                }
              }
            }

            if (action === 'closed' && target.merged) {
              for (const issueNumber of linkedIssues) {
                const issueBody = withUser(prMergedTemplate(target.number), login);
                await createCommentOnce(issueNumber, issueBody, `${MERGED_MARKER_PREFIX}${target.number} -->`);
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  state: 'closed',
                }).catch(async (error) => {
                  if (error.status === 404 || error.status === 410 || error.status === 422) return;
                  throw error;
                });
                await addLabels(issueNumber, ['status:ready-to-close']);
              }
            }
